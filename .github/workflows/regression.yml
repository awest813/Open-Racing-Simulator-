name: Regression

on:
  push:
    branches: [r1-3-1, main, 'cursor/**']
  pull_request:

jobs:
  linux-autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake \
            libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            libplib-dev libopenal-dev libalut-dev \
            libvorbis-dev zlib1g-dev libpng-dev libx11-dev libxrandr-dev \
            libxi-dev libxmu-dev libxxf86vm-dev libxml2-utils

      - name: Build (autotools)
        run: |
          ./configure
          make exports
          make -j"$(nproc)" compil

      - name: Headless regression race
        run: |
          export TORCS_BIN="$PWD/src/linux/torcs-bin"
          export TORCS_LIB="$PWD/export"
          export TORCS_DATA="$PWD"
          export TORCS_RUNTIME="$PWD/runtime"
          chmod +x test/regression/run_regression.sh
          ./test/regression/run_regression.sh
